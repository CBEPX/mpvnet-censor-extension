# Статическое меню mpv.net. Текущее состояние видно в окне расширения и OSD.
Ctrl+Alt+c script-message-to censor censor-open #custom-menu: Цензура > Интервалы…
Ctrl+Alt+o script-message-to censor censor-pick
Ctrl+Alt+r script-message-to censor censor-reload
Ctrl+Alt+a script-message-to censor censor-apply #custom-menu: Цензура > Применить интервалы
Ctrl+Alt+d script-message-to censor censor-disable #custom-menu: Цензура > Выключить размытие
F7 script-message-to censor censor-mark-start #custom-menu: Цензура > Отметить начало интервала
F8 script-message-to censor censor-mark-end #custom-menu: Цензура > Отметить конец интервала
Ctrl+F7 script-message-to censor censor-set-start
Ctrl+F8 script-message-to censor censor-set-end
Alt+Left script-message-to censor censor-previous
Alt+Right script-message-to censor censor-next
Ctrl+Shift+s script-message-to censor censor-save
