name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore pinned mpv.net reference
        run: bash scripts/restore-mpvnet.sh

      - name: Restore
        run: dotnet restore CensorPlayer.sln --locked-mode

      - name: Build
        run: dotnet build CensorPlayer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CensorPlayer.sln --configuration Release --no-build --no-restore

      - name: Verify stock extension loader contract
        run: >-
          dotnet run
          --project tests/Censor.LoaderSmoke/Censor.LoaderSmoke.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          src/Censor.MpvNet.Extension/bin/Release/CensorExtension.dll

      - name: Verify pinned Inno Setup
        shell: pwsh
        run: |
          $expected = (Get-Content deps.lock.json -Raw | ConvertFrom-Json).tools.innoSetup.version
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc -PathType Leaf)) {
            throw "Inno Setup compiler is missing: $iscc"
          }
          $actual = (Get-Item $iscc).VersionInfo.FileVersionRaw.ToString(3)
          if ($actual -ne $expected) {
            throw "Expected Inno Setup $expected, found $actual."
          }

      - name: Build portable, installer, project source, checksums, and SBOM
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -Commit $env:GITHUB_SHA
          -RunId $env:GITHUB_RUN_ID

      - name: Verify release artifacts
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1 -ArtifactDirectory artifacts/windows/release

      - name: Smoke installer
        shell: pwsh
        run: >-
          ./scripts/smoke-installer.ps1
          -InstallerPath (Get-ChildItem artifacts/windows/release/CensorPlayer-Setup-*-x64.exe).FullName

      - name: Upload extension build evidence
        uses: actions/upload-artifact@v7
        with:
          name: CensorExtension-windows-x64
          if-no-files-found: error
          path: |
            src/Censor.MpvNet.Extension/bin/Release/CensorExtension.dll
            artifacts/windows/release/CensorPlayer-*-project-source.zip
            LICENSE
            THIRD_PARTY_NOTICES.md
            examples/input.conf
          retention-days: 30
