name: Windows package validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore pinned mpv.net reference
        run: bash scripts/restore-mpvnet.sh

      - name: Restore, build, and test
        run: |
          dotnet restore CensorPlayer.sln --locked-mode
          dotnet build CensorPlayer.sln --configuration Release --no-restore `
            -p:Version=$env:RELEASE_VERSION `
            -p:InformationalVersion=$env:RELEASE_VERSION
          dotnet test CensorPlayer.sln --configuration Release --no-build --no-restore

      - name: Verify stock extension loader contract
        run: >-
          dotnet run
          --project tests/Censor.LoaderSmoke/Censor.LoaderSmoke.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          src/Censor.MpvNet.Extension/bin/Release/CensorExtension.dll

      - name: Verify pinned Inno Setup
        shell: pwsh
        run: |
          $expected = (Get-Content deps.lock.json -Raw | ConvertFrom-Json).tools.innoSetup.version
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc -PathType Leaf)) {
            throw "Inno Setup compiler is missing: $iscc"
          }
          $installed = @(
            choco list --exact innosetup --limit-output |
              Where-Object { $_ -like "innosetup|*" }
          )
          $actual = if ($installed.Count -eq 1) {
            ($installed[0] -split "\|", 2)[1]
          } else {
            ""
          }
          if ($actual -ne $expected) {
            throw "Expected Inno Setup $expected, found $actual."
          }

      - name: Build and verify release
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 `
            -Version $env:RELEASE_VERSION `
            -Commit $env:GITHUB_SHA `
            -RunId $env:GITHUB_RUN_ID
          ./scripts/verify-release-artifacts.ps1 `
            -ArtifactDirectory artifacts/windows/release
          ./scripts/smoke-installer.ps1 `
            -InstallerPath (Get-ChildItem artifacts/windows/release/CensorPlayer-Setup-*-x64.exe).FullName

      - name: Upload extension build evidence
        uses: actions/upload-artifact@v7
        with:
          name: CensorExtension-${{ inputs.version }}-windows-x64
          if-no-files-found: error
          path: |
            src/Censor.MpvNet.Extension/bin/Release/CensorExtension.dll
            artifacts/windows/release/CensorPlayer-*-project-source.zip
            LICENSE
            THIRD_PARTY_NOTICES.md
            examples/input.conf
          retention-days: 90
